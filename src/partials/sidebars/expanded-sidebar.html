<div
  x-data="initSidebar()"
  class="plex-sidebar"
  :class="{
        'is-inactive': $store.app.isLayoutExpanded,
        '': !$store.app.isLayoutExpanded,
        'is-mobile-active': $store.app.isMobileActive,
        '': !$store.app.isMobileActive
    }"
>
  <div class="sidebar-header">
    <h3>Plex</h3>
    <button @click="toggleSidebar()" class="menu-icon v-5 is-hidden-mobile">
      <span></span>
    </button>
    <button
      @click="toggleMobileMenu()"
      class="menu-icon v-5 is-open mobile-item is-block mobile-sidebar-trigger"
    >
      <span></span>
    </button>
  </div>
  <div class="sidebar-profile">
    <div class="avatar-container">
      <div class="avatar-wrapper">
        <div class="avatar">
          <img src="/img/avatars/3.jpg" alt="" />
          <span class="badge">
            <i class="iconify" data-icon="feather:check"></i>
          </span>
        </div>
        <h3>Anthony Miller</h3>
        <p>Accountant</p>
      </div>
    </div>
  </div>
  <div class="sidebar-menu has-slimscroll">
    <a class="menu-item is-active">
      <i class="iconify" data-icon="feather:grid"></i>
      <span>Dashboard</span>
    </a>
    <a class="menu-item">
      <i class="iconify" data-icon="feather:file-text"></i>
      <span>Invoices</span>
    </a>
    <a class="menu-item">
      <i class="iconify" data-icon="feather:file"></i>
      <span>Bills</span>
    </a>
    <a class="menu-item">
      <i class="iconify" data-icon="feather:git-branch"></i>
      <span>Reconcile</span>
    </a>
    <a class="menu-item">
      <i class="iconify" data-icon="feather:mail"></i>
      <span>Messages</span>
    </a>
    <a class="menu-item">
      <i class="iconify" data-icon="feather:settings"></i>
      <span>Settings</span>
    </a>
    <div class="naver"></div>
  </div>
</div>
